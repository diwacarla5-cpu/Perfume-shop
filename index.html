<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfume Store</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f8f1f1;
      color:#333;
    }

    header{
      background:#b3003c;
      color:white;
      padding:20px;
      text-align:center;
    }

    header h1{
      font-size:40px;
    }

    .container{
      display:flex;
      justify-content:center;
      gap:20px;
      flex-wrap:wrap;
      padding:40px;
    }

    .card{
      background:white;
      width:250px;
      border-radius:15px;
      overflow:hidden;
      box-shadow:0 5px 10px rgba(0,0,0,0.2);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-10px);
    }

    .card img{
      width:100%;
      height:250px;
      object-fit:cover;
    }

    .card-content{
      padding:20px;
      text-align:center;
    }

    .card-content h2{
      margin-bottom:10px;
      color:#b3003c;
    }

    .price{
      font-size:22px;
      margin:10px 0;
      font-weight:bold;
    }

    button{
      background:#b3003c;
      color:white;
      border:none;
      padding:10px 20px;
      border-radius:10px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#80002a;
    }

    footer{
      text-align:center;
      padding:20px;
      background:#b3003c;
      color:white;
      margin-top:20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Kaye Perfume Shop</h1>
    <p>Luxury Fragrance Collection</p>
  </header>

  <div class="container">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1541643600914-78b084683601?q=80&w=800" alt="Perfume">
      <div class="card-content">
        <h2>Rose Velvet</h2>
        <p>Sweet and elegant fragrance.</p>
        <div class="price">₱999</div>
        <button onclick="buyPerfume('Rose Velvet')">Buy Now</button>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1594035910387-fea47794261f?q=80&w=800" alt="Perfume">
      <div class="card-content">
        <h2>Midnight Bloom</h2>
        <p>Strong and classy scent.</p>
        <div class="price">₱1,299</div>
        <button onclick="buyPerfume('Midnight Bloom')">Buy Now</button>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1615634262417-98baecba4c9b?q=80&w=800" alt="Perfume">
      <div class="card-content">
        <h2>Golden Kiss</h2>
        <p>Fresh and romantic aroma.</p>
        <div class="price">₱1,499</div>
        <button onclick="buyPerfume('Golden Kiss')">Buy Now</button>
      </div>
    </div>

  </div>

  <footer>
    <p>© 2026 Kaye Perfume Shop</p>
  </footer>

  <script>
    function buyPerfume(name){
      alert("You selected: " + name);
    }
  </script>

</body>
</html>
